name: daily-fixtures
on:
  schedule:
    - cron: '0 1 * * *'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests beautifulsoup4
      - run: python scrape.py --selftest && python scrape.py
      - name: commit
        run: |
          git config user.name "nexus-bot"
          git config user.email "bot@users.noreply.github.com"
          git add docs/fixtures.json
          git diff --cached --quiet || git commit -m "update fixtures" && git push
